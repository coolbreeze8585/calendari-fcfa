
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Calendari auxiliar FCFA | 2026-27</title>

  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <header>
    <h1>Calendari auxiliar FCFA</h1>
    <p>Temporada 2026–27 · Projecte independent</p>
  </header>

  <main>
    <nav class="controls" aria-label="Navegació del calendari">
      <button id="prev-month" type="button"
              aria-label="Mes anterior">
        ◀
      </button>

      <h2 id="month-title">Carregant calendari...</h2>

      <button id="next-month" type="button"
              aria-label="Mes següent">
        ▶
      </button>
    </nav>

    <section
      id="calendar"
      class="calendar"
      aria-label="Calendari de divendres a dilluns">
    </section>

    <section id="day-details" aria-live="polite"></section>
  </main>

  <footer>
    <p>
      Eina de consulta independent i no oficial.
      No afiliat a la FCFA.
    </p>
  </footer>
</body>
</html>
